name: hankookchon job monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (UTC 기준, 몇 분 지연될 수 있음)
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install -r requirements.txt
          python -m camoufox fetch

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Upload debug html (있을 때만)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-debug
          path: page_debug.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit state
        run: |
          git pull --rebase || true
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "update seen state [skip ci]"
          git push
